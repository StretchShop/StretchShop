name: Docker

on:
  push:
    # Publish `master` as Docker `latest` image.
    branches:
      - master

    # Publish `v1.2.3` tags as releases.
    tags:
      - v*

  # Run tests for any PRs.
  pull_request:

env:
  IMAGE_NAME: wradgio/stretchshop

jobs:
  # Build the image (Dockerfile seeds StretchShop-demo-data, then overlays
  # repo resources/public so pdf fonts and nested templates are kept).
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          if [ -f docker-compose.test.yml ]; then
            docker compose --file docker-compose.test.yml build
            docker compose --file docker-compose.test.yml run sut
          else
            docker build . --file Dockerfile --tag $IMAGE_NAME:test
          fi

      - name: Verify runtime assets in image
        if: ${{ hashFiles('docker-compose.test.yml') == '' }}
        run: |
          docker run --rm --entrypoint sh "$IMAGE_NAME:test" -c '
            test -f /app/resources/pdftemplates/fonts/pdfmake-font-definition.js
            test -f /app/resources/pdftemplates/fonts/Roboto-Regular.ttf
            test -f /app/resources/navigation/navigation-main.json
            test -f /app/resources/pages/_default/default/default.html
            test -d /app/public/assets/data
            node -e "require(\"./resources/pdftemplates/fonts/pdfmake-font-definition\"); require(\"./mixins/pdfprint.mixin\"); console.log(\"pdf assets ok\")"
          '

  # Push image to Docker Hub.
  push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Log into registry
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin

      - name: Build image
        run: docker build . --file Dockerfile --tag $IMAGE_NAME

      - name: Push image
        run: |
          IMAGE_ID=$IMAGE_NAME

          # Change all uppercase to lowercase
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')

          # Strip git ref prefix from version
          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')

          # Strip "v" prefix from tag name
          [[ "${{ github.ref }}" == "refs/tags/"* ]] && VERSION=$(echo $VERSION | sed -e 's/^v//')

          # Use Docker `latest` tag convention
          [ "$VERSION" == "master" ] && VERSION=latest

          echo IMAGE_ID=$IMAGE_ID
          echo VERSION=$VERSION

          docker tag $IMAGE_NAME $IMAGE_ID:$VERSION
          docker push $IMAGE_ID:$VERSION
