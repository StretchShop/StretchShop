<p style="margin:0 0 8px 0;">Estimado usuario,</p>

</p>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border:1px solid #e6e6e6;border-collapse:collapse;margin:0 0 16px 0;">
  <tr>
    <td colspan="2" style="padding:10px 12px;background-color:#f7f7f7;font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:bold;color:#111111;border-bottom:1px solid #e6e6e6;">Datos de acceso</td>
  </tr>

    <td style="padding:8px 12px;font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#666666;width:36%;border-bottom:1px solid #eeeeee;">Administrador</td>

  </tr>
  <tr>
    <td style="padding:8px 12px;font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#666666;border-bottom:1px solid #eeeeee;">Email</td>

  </tr>

    <td style="padding:8px 12px;font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#666666;">Fecha</td>

<p style="margin:0;font-size:13px;color:#666666;">Si esta acción no era esperada, contáctenos en {{support_email}}.</p>
