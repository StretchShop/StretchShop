version: "3.0"

services:

  api:
    build:
      context: ../..
    image: wradgio/stretchshop_demo:latest
    restart: unless-stopped
    env_file: docker-compose.env
    environment:
      # Add `,openapi` to SERVICES if you set OPENAPI_ENABLED=true
      SERVICES: api,users,metrics
      PORT: 3000
    links:
        - mongo
    depends_on:
        - mongo
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/`)"
      - "traefik.http.services.api.loadbalancer.server.port=3000"
    volumes:
      - /var/www/html/stretchshop/static:/app/public/assets/data
      - /var/www/html/stretchshop/app/stretchshop/.temp:/app/.temp
#      - /etc/letsencrypt/:/etc/letsencrypt
    networks:
      - internal


  products:
    build:
      context: ../..
    image: wradgio/stretchshop_demo:latest
    restart: unless-stopped
    env_file: docker-compose.env
    environment:
      SERVICES: products,pages,categories
    links:
      - mongo
    depends_on:
      - mongo
    volumes:
      - /var/www/html/stretchshop/static:/app/public/assets/_s
      - /var/www/html/stretchshop/app/stretchshop/.temp:/app/.temp
    networks:
      - internal


  orders:
    build:
      context: ../..
    image: wradgio/stretchshop_demo:latest
    restart: unless-stopped
    env_file: docker-compose.env
    environment:
      SERVICES: cart,orders,subscriptions
    links:
      - mongo
    depends_on:
      - mongo
    volumes:
      - /var/www/html/stretchshop/static:/app/public/assets/_s
      - /var/www/html/stretchshop/app/stretchshop/.temp:/app/.temp
    networks:
      - internal


  mongo:
    image: mongo:7.0.18
    restart: on-failure
    volumes:
      - ./db:/data/db
      - ./dbconf:/etc/mongo
    # Do not publish Mongo to the host in production.
    # ports:
    #   - "27017:27017"
    command: mongod --auth
    networks:
      - internal


  nats-server:
    image: nats:2.10-alpine
    restart: unless-stopped
    # Do not publish NATS to the host in production.
    # ports:
    #   - "4222:4222"
    networks:
      - internal


  redis:
    image: redis:7.4-alpine
    restart: on-failure
    networks:
      - internal


  traefik:
    image: traefik:v3.3.5
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
    ports:
      - "3100:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal
      - default


networks:
  internal:

volumes:
  data:

